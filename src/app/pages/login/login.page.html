<ion-content class="login-content">
  
  <!-- // SPINNER EXIGIDO (Aparece cuando isLoading es true) -->
  
  <app-cepa-spinner *ngIf="isLoading" [texto]="'Iniciando sesión...'"></app-cepa-spinner>

  <!-- CONTENEDOR PRINCIPAL (Se esconde mientras carga) -->
  <div class="login-container" *ngIf="!isLoading">
    <div class="login-header">
      <img src="assets/icono.png" alt="Logo Cepa" class="login-logo" />
      <div class="login-divider"></div>
    </div>

    <h2 class="login-title">Bienvenido</h2>
    <p class="login-subtitle">Ingresá tus datos para continuar</p>

    <!-- 1. Enlace del Formulario y el evento Submit -->
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
      
      <ion-item lines="none" class="login-item">
        <ion-icon name="mail-outline" slot="start"></ion-icon>

        <!-- 2. Enlace del control 'email' -->
        <ion-input
          formControlName="email"
          label="Correo electrónico"
          labelPlacement="floating"
          type="email"
          placeholder="nombre@correo.com">
        </ion-input>
      </ion-item>

      <!-- 3. Mensaje de error individual -->
      <div *ngIf="(loginForm.get('email')?.dirty || formEnviado) && loginForm.get('email')?.invalid">
      <small style="color: var(--ion-color-danger); padding-left: 16px;">Correo inválido.</small>
      </div>

      <ion-item lines="none" class="login-item">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <!-- 2. Enlace del control 'clave' -->
        <ion-input
          formControlName="clave"
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          placeholder="Ingrese su contraseña">
          
        </ion-input>
      </ion-item>
      <!-- 3. Mensaje de error individual -->
      <div *ngIf="(loginForm.get('clave')?.dirty || formEnviado) && loginForm.get('clave')?.invalid">
      <small style="color: var(--ion-color-danger); padding-left: 16px;">Mínimo 6 caracteres.</small>
      </div>

      <!-- 3. Mensaje de error general (en lugar de Alert) -->
      <ion-text color="danger" *ngIf="errorMessage" class="ion-text-center" style="display: block; margin-top: 10px;">
        <p><strong>{{ errorMessage }}</strong></p>
      </ion-text>

      <p class="login-forgot">¿Olvidaste tu contraseña?</p>

      <!-- 4. Boton tipo Submit -->
      <ion-button type="submit" expand="block" class="login-submit">Ingresar</ion-button>
    </form>

    <app-acceso-rapido (perfilSeleccionado)="cargarPerfil($event)"></app-acceso-rapido>

  </div>
</ion-content>
