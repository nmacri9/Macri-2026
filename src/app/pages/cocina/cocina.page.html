<app-cepa-header [titulo]="'Comandas - Cocina'"></app-cepa-header>

<ion-content class="ion-padding cocina-content">
  <app-cepa-spinner *ngIf="cargando" [texto]="'Actualizando pedidos...'"></app-cepa-spinner>

  <div *ngIf="pedidosCocina.length === 0" class="sin-pedidos">
    <ion-icon name="restaurant-outline"></ion-icon>
    <h2>Sin pedidos pendientes</h2>
    <p>La cocina está al día.</p>
  </div>

  <!-- Iteramos sobre el array ya procesado -->
  <ion-card *ngFor="let pedido of pedidosCocina" class="comanda-card">
    <ion-card-header>
      <div class="header-comanda">
        <ion-card-title>Mesa {{ pedido.mesa_id }}</ion-card-title>
        <!-- AGREGADA LA FECHA AL FORMATO -->
        <ion-badge color="warning">
          <ion-icon name="time-outline"></ion-icon>
          {{ pedido.created_at | date:'dd/MM - HH:mm' }}
        </ion-badge>
      </div>
    </ion-card-header>

    <ion-card-content>
      <!-- CONTENEDOR CON SCROLL CONTROLADO -->
      <div class="scroll-controlado">
        <ion-list lines="full" class="lista-items">
          <!-- Mostramos solo los items de comida -->
          <ion-item *ngFor="let item of pedido.items">
            <ion-label>
              <h3>{{ item.nombre }}</h3>
            </ion-label>
            <ion-badge slot="end" color="light" class="badge-cantidad">x{{ item.cantidad }}</ion-badge>
          </ion-item>
        </ion-list>
      </div>

      <ion-button expand="block" color="success" class="btn-listo" (click)="abrirModalConfirmacion(pedido.id)">
        <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
        Pedido Listo
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
