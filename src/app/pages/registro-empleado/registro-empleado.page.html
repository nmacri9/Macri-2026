<app-cepa-header [titulo]="'Registro de Empleados'"></app-cepa-header>

<ion-content class="registro-content">
  <app-cepa-spinner *ngIf="cargando"></app-cepa-spinner>

  <form [formGroup]="registroForm" (ngSubmit)="confirmarAlta()" [hidden]="cargando">

    <div class="avatar-hero">
      <div class="actions-row">
        <!-- Grupo Foto -->
        <div class="action-item">
          <input type="file" accept="image/*" #fileInput (change)="onFileSelected($event)" style="display: none;" />
          <button type="button" class="avatar-ring" (click)="fotoPreview ? abrirModal() : tomarFoto()">
            <img *ngIf="fotoPreview" [src]="fotoPreview" class="avatar-img" alt="Foto empleado">
            <ion-icon *ngIf="!fotoPreview" name="camera-outline" class="avatar-placeholder"></ion-icon>
            <span class="avatar-badge">
              <ion-icon name="camera"></ion-icon>
            </span>
          </button>
          <span class="action-label">Foto</span>
        </div>

        <!-- Grupo Escáner -->
        <div class="action-item">
          <button type="button" class="scan-bubble" (click)="escanearDNI()">
            <ion-icon name="qr-code-outline"></ion-icon>
          </button>
          <span class="action-label">Escanear DNI</span>
        </div>
      </div>
      <small class="avatar-error" *ngIf="(registroForm.get('foto')?.dirty || formEnviado) && registroForm.get('foto')?.invalid">
        La foto es obligatoria.
      </small>
    </div>

    <!-- Campos autocompletables por DNI -->
    <section class="form-section">
      <h3 class="section-label">Datos personales</h3>

      <ion-item class="field" lines="none">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input formControlName="nombres" label="Nombres" labelPlacement="floating" type="text"></ion-input>
      </ion-item>

      <ion-item class="field" lines="none">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input formControlName="apellidos" label="Apellidos" labelPlacement="floating" type="text"></ion-input>
      </ion-item>

      <ion-item class="field" lines="none">
        <ion-icon name="card-outline" slot="start"></ion-icon>
        <ion-input formControlName="dni" label="DNI" labelPlacement="floating" type="tel"></ion-input>
      </ion-item>

      <ion-item class="field" lines="none">
        <ion-icon name="document-text-outline" slot="start"></ion-icon>
        <ion-input formControlName="cuil" label="CUIL" labelPlacement="floating" type="tel"></ion-input>
      </ion-item>
    </section>

    <!-- Campos manuales -->
    <section class="form-section">
      <h3 class="section-label">Acceso al sistema</h3>

      <ion-item class="field" lines="none">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input formControlName="email" label="Correo Electrónico" labelPlacement="floating" type="email"></ion-input>
      </ion-item>
      
      <ion-item class="field" lines="none">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input formControlName="clave" label="Contraseña temporal" labelPlacement="floating" type="password"></ion-input>
      </ion-item>

      <ion-item class="field" lines="none">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input formControlName="confirmarClave" label="Confirmar Contraseña" labelPlacement="floating" type="password"></ion-input>
      </ion-item>

      <ion-item class="field" lines="none">
        <ion-icon name="briefcase-outline" slot="start"></ion-icon>
        <ion-select formControlName="perfil" label="Perfil" labelPlacement="floating" cancelText="Cancelar" okText="OK" [interfaceOptions]="{ cssClass: 'cepa-select-alert' }">
          <ion-select-option value="COCINERO">Cocinero</ion-select-option>
          <ion-select-option value="MOZO">Mozo</ion-select-option>
          <ion-select-option value="CANTINERO">Cantinero</ion-select-option>
          <ion-select-option value="METRE">Metre</ion-select-option>
        </ion-select>
      </ion-item>
    </section>

    <div class="form-error" *ngIf="registroForm.errors?.['mismatch'] && (registroForm.get('confirmarClave')?.touched || formEnviado)">
      <small>Las contraseñas no coinciden.</small>
    </div>

    <div class="form-error" *ngIf="formEnviado && registroForm.invalid && !registroForm.errors?.['mismatch']">
      <small>Por favor, revise los campos vacíos o incorrectos.</small>
    </div>

    <div class="form-error" *ngIf="errorSupabase">
      <small>{{ errorSupabase }}</small>
    </div>
  </form>

  <!-- POPUP PARA VER LA IMAGEN GRANDE -->
  <ion-modal [isOpen]="modalAbierta" (didDismiss)="cerrarModal()">
    <ng-template>
      <ion-header class="ion-no-border">
        <ion-toolbar style="--background: var(--color-bg);">
          <ion-buttons slot="end">
            <ion-button (click)="cerrarModal()">
              <ion-icon name="close-outline" style="color: var(--color-accent); font-size: 36px;"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      
      <ion-content style="--background: var(--color-bg);" class="ion-padding">
        <div class="modal-foto-container">
          <img *ngIf="fotoPreview" [src]="fotoPreview" alt="Foto ampliada" class="foto-ampliada">
        </div>
        
        <div style="margin-top: 30px;">
          <ion-button expand="block" class="btn-submit" (click)="tomarFoto(); cerrarModal()">
            <ion-icon name="camera-outline" slot="start"></ion-icon>
            Cambiar Foto
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>

<!-- BOTÓN FIJO EN EL FOOTER (SCROLL CONTROLADO) -->
<ion-footer class="submit-footer ion-no-border">
  <div class="submit-bar">
    <ion-button class="btn-submit" type="button" expand="block" (click)="confirmarAlta()" [disabled]="cargando">
      {{ cargando ? 'Guardando...' : 'Guardar Empleado' }}
    </ion-button>
  </div>
</ion-footer>
