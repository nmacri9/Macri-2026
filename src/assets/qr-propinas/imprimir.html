<h1>CEPA · ¿Cómo estuvo tu experiencia?</h1>
<p>Después de solicitar la cuenta, escaneá desde la app el QR de la propina que querés dejar.</p>
<main>
  <article><img src="propina-20.svg" alt="QR de propina del 20%"><h2>Excelente</h2><strong>20%</strong></article>
