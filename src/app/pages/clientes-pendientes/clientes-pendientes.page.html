<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button defaultHref="/home" text="" aria-label="Volver"></ion-back-button></ion-buttons>
    <ion-title>Clientes pendientes</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cargarClientes()" [disabled]="cargando || procesandoId !== null" aria-label="Actualizar clientes pendientes">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <app-cepa-spinner *ngIf="cargando"></app-cepa-spinner>
  <div class="status-message error-message" *ngIf="errorMensaje" role="alert">
    <p>{{ errorMensaje }}</p>
    <ion-button fill="clear" (click)="cargarClientes()" [disabled]="cargando || procesandoId !== null">Actualizar lista</ion-button>
  </div>
  <p class="status-message" *ngIf="mensajeExito" role="status">{{ mensajeExito }}</p>

  <div class="list-container" *ngIf="clientesPendientes.length > 0 && !cargando">
    <div class="client-card" *ngFor="let cliente of clientesPendientes" [attr.aria-busy]="procesandoId === cliente.id">
      <div class="card-content">
        <div class="avatar-container">
          <img *ngIf="cliente.foto_url; else sinFoto" [src]="cliente.foto_url" alt="Foto del cliente" (error)="cliente.foto_url = null">
          <ng-template #sinFoto><ion-icon name="person-circle-outline" aria-label="Sin foto"></ion-icon></ng-template>
        </div>
        <div class="info-container">
          <h2>{{ cliente.apellido }}</h2>
          <h3>{{ cliente.nombre }}</h3>
        </div>
      </div>
      <div class="actions-container">
        <ion-button fill="outline" class="reject-button" [disabled]="procesandoId !== null" (click)="rechazarCliente(cliente.id, (cliente.nombre || '') + ' ' + cliente.apellido)">
          <ion-icon slot="start" name="close-circle-outline"></ion-icon>Rechazar
        </ion-button>
        <ion-button fill="solid" class="approve-button" [disabled]="procesandoId !== null" (click)="aceptarCliente(cliente.id, (cliente.nombre || '') + ' ' + cliente.apellido)">
          <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>Aprobar
        </ion-button>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="!cargando && !errorMensaje && clientesPendientes.length === 0">
    <p>No hay clientes pendientes de aprobación.</p>
  </div>
</ion-content>
