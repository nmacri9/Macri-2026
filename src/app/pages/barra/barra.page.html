<app-cepa-header [titulo]="'Comandas - Barra'"></app-cepa-header>

<ion-content class="ion-padding" style="--background: #132A20;">

  <app-cepa-spinner *ngIf="cargando" [texto]="'Actualizando pedidos...'"></app-cepa-spinner>
  
  <div *ngIf="pedidosBarra.length === 0" class="sin-pedidos">
    <h2>Sin pedidos pendientes</h2>
    <p>La barra está al día.</p>
  </div>

  <!-- Iteramos sobre el array ya procesado -->
  <ion-card *ngFor="let pedido of pedidosBarra; trackBy: trackByPedido" class="comanda-card" [class.abierto]="pedidoAbiertoId === pedido.id">
    <ion-card-header>
      <div class="header-comanda cabecera-toggle" role="button" tabindex="0"
           [attr.aria-expanded]="pedidoAbiertoId === pedido.id"
           (click)="alternarPedido(pedido.id)" (keydown.enter)="alternarPedido(pedido.id)">
        <ion-card-title>Mesa {{ pedido.mesa_id }}</ion-card-title>
        <div class="cabecera-derecha">
          <ion-badge color="warning">
            <ion-icon name="time-outline"></ion-icon>
            {{ pedido.created_at | date: 'dd/MM - HH:mm' }}
          </ion-badge>
          <ion-icon name="chevron-down-outline" class="chevron-toggle"></ion-icon>
        </div>
      </div>
      <p class="resumen-linea">{{ cantidadItems(pedido) }} ítems</p>
    </ion-card-header>

    <!-- DETALLE: solo con el pedido abierto -->
    <ion-card-content *ngIf="pedidoAbiertoId === pedido.id">
      <div class="scroll-controlado">
      <ion-list lines="full" class="lista-items">
        <!-- Mostramos solo los items de bebiaa -->
        <ion-item *ngFor="let item of pedido.items">
          <ion-label>
            <h3>{{ item.nombre }}</h3>
          </ion-label>
          <ion-badge slot="end" color="light">x{{ item.cantidad }}</ion-badge>
        </ion-item>
      </ion-list>
      </div>

      <ion-button expand="block" color="success" class="btn-listo" (click)="abrirModalConfirmacion(pedido.id)">
        <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
        Pedido Listo
      </ion-button>
    </ion-card-content>
  </ion-card>

</ion-content>
