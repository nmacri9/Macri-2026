<app-cepa-header titulo="Carga de Bebidas"></app-cepa-header>

<ion-content class="alta-content" [fullscreen]="true">

  <app-cepa-spinner *ngIf="cargando" texto="Cargando bebida en la carta..."></app-cepa-spinner>

  <div class="alta-container" *ngIf="!cargando">

    <div class="alta-header">
        <p class="alta-subtitle">CANTINERO</p>
        <div class="alta-divider"></div>
        </div>

        <form [formGroup]="formBebida" (ngSubmit)="guardar()" id="formAltaBebida">

        <ion-item class="alta-item" lines="none">
            <ion-icon name="wine-outline" slot="start"></ion-icon>
            <ion-input
            formControlName="nombre"
            type="text"
            placeholder="Nombre de la bebida">
            </ion-input>
        </ion-item>
        <div class="error-text" *ngIf="formBebida.get('nombre')?.touched && formBebida.get('nombre')?.invalid">
            El nombre es obligatorio.
        </div>

        <ion-item class="alta-item" lines="none">
            <ion-icon name="document-text-outline" slot="start"></ion-icon>
            <ion-textarea
            formControlName="descripcion"
            rows="2"
            placeholder="Descripción">
            </ion-textarea>
        </ion-item>
        <div class="error-text" *ngIf="formBebida.get('descripcion')?.touched && formBebida.get('descripcion')?.invalid">
            Ingrese una descripción válida.
        </div>

        <!-- Selector de tiempo -->
        <p class="alta-section-label" style="margin-top: 0px; margin-bottom: 8px;">Tiempo de preparación</p>
        
        <div class="tiempo-selector">
            <button type="button" class="tiempo-btn" 
                    [class.activo]="formBebida.get('tiempo_elaboracion')?.value === 5" 
                    (click)="formBebida.get('tiempo_elaboracion')?.setValue(5)">5 MIN</button>
                    
            <button type="button" class="tiempo-btn" 
                    [class.activo]="formBebida.get('tiempo_elaboracion')?.value === 15" 
                    (click)="formBebida.get('tiempo_elaboracion')?.setValue(15)">15 MIN</button>
                    
            <button type="button" class="tiempo-btn" 
                    [class.activo]="formBebida.get('tiempo_elaboracion')?.value === 30" 
                    (click)="formBebida.get('tiempo_elaboracion')?.setValue(30)">30 MIN</button>
        </div>
        
        <div class="error-text" *ngIf="formBebida.get('tiempo_elaboracion')?.touched && formBebida.get('tiempo_elaboracion')?.invalid">
            Seleccione un tiempo.
        </div>

        <ion-item class="alta-item" lines="none">
            <ion-icon name="cash-outline" slot="start"></ion-icon>
            <ion-input
            formControlName="precio"
            type="number"
            placeholder="Precio ($)">
            </ion-input>
        </ion-item>
        <div class="error-text" *ngIf="formBebida.get('precio')?.touched && formBebida.get('precio')?.invalid">
            Ingrese un precio válido.
        </div>

        <!-- Visor de Fotos (Flechas Laterales) -->
        <div class="fotos-container">
            
            <div class="fotos-header-center">
            <span class="fotos-title">FOTO {{ fotoActivaIndex + 1 }} DE 3</span>
            </div>

            <div class="foto-visor-row">
            <ion-button fill="clear" class="btn-flecha" (click)="anteriorFoto()" [disabled]="fotoActivaIndex === 0">
                <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
            </ion-button>

            <div class="foto-caja">
                <img *ngIf="previews[fotoActivaIndex]" [src]="previews[fotoActivaIndex]" alt="Foto {{ fotoActivaIndex + 1 }}" />
                <span *ngIf="!previews[fotoActivaIndex]">Agregar imagen...</span>
            </div>

            <ion-button fill="clear" class="btn-flecha" (click)="siguienteFoto()" [disabled]="fotoActivaIndex === 2">
                <ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon>
            </ion-button>
            </div>

            <div class="foto-botones-row">
            <ion-button fill="outline" class="btn-foto-abajo" (click)="seleccionarFoto(fotoActivaIndex, 'camera')">
                <ion-icon name="camera-outline" slot="start"></ion-icon>
                Cámara
            </ion-button>
            <ion-button fill="outline" class="btn-foto-abajo" (click)="seleccionarFoto(fotoActivaIndex, 'photos')">
                <ion-icon name="images-outline" slot="start"></ion-icon>
                Galería
            </ion-button>
            </div>
        </div>

        <div class="banner-error" *ngIf="mensajeError">
            {{ mensajeError }}
        </div>

        <div class="banner-exito" *ngIf="mensajeExito">
            {{ mensajeExito }}
        </div>

        <ion-button expand="block" type="submit" class="alta-submit">
            Registrar Bebida
        </ion-button>
        </form>
    </div>
</ion-content>
