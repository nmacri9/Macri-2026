    <app-cepa-header [titulo]="'Alta de Bebidas'"></app-cepa-header>


    <ion-content class="alta-content">
    <!-- Spinner / Indicador de Carga Excluyente -->
    <app-cepa-spinner 
        *ngIf="cargando" 
        [texto]="'Cargando bebida en la carta...'">
    </app-cepa-spinner>

    <div class="alta-container" *ngIf="!cargando">
        
        <div class="alta-header">
        <h2 class="alta-title">Alta de Bebida</h2>
        <p class="alta-subtitle">Perfil Cantinero</p>
        <div class="alta-divider"></div>
        </div>

        <form [formGroup]="formBebida" (ngSubmit)="guardar()">
        
        <!-- Nombre de la bebida -->
        
        <ion-item class="alta-item" lines="none">
            <ion-icon name="wine-outline" slot="start"></ion-icon>
            <ion-input 
            formControlName="nombre" 
            type="text" 
            placeholder="Nombre de la bebida">
            </ion-input>
        </ion-item>
        <div class="error-text" *ngIf="formBebida.get('nombre')?.touched && formBebida.get('nombre')?.invalid">
            El nombre es obligatorio.
        </div>

        <!-- Descripción -->
        <ion-item class="alta-item" lines="none">
            <ion-icon name="document-text-outline" slot="start"></ion-icon>
            <ion-textarea 
            formControlName="descripcion" 
            rows="2" 
            placeholder="Descripción">
            </ion-textarea>
        </ion-item>
        <div class="error-text" *ngIf="formBebida.get('descripcion')?.touched && formBebida.get('descripcion')?.invalid">
            Ingrese una descripción válida.
        </div>

        <!-- Tiempo de elaboración -->
        <ion-item class="alta-item" lines="none">
            <ion-icon name="time-outline" slot="start"></ion-icon>
            <ion-input 
            formControlName="tiempo_elaboracion" 
            type="number" 
            placeholder="Tiempo de elaboración (minutos)">
            </ion-input>
        </ion-item>
        <div class="error-text" *ngIf="formBebida.get('tiempo_elaboracion')?.touched && formBebida.get('tiempo_elaboracion')?.invalid">
            Ingrese un tiempo válido en minutos.
        </div>

        <!-- Precio -->
        <ion-item class="alta-item" lines="none">
            <ion-icon name="cash-outline" slot="start"></ion-icon>
            <ion-input 
            formControlName="precio" 
            type="number" 
            placeholder="Precio ($)">
            </ion-input>
        </ion-item>
        <div class="error-text" *ngIf="formBebida.get('precio')?.touched && formBebida.get('precio')?.invalid">
            Ingrese un precio válido.
        </div>

        <!-- Sección de Fotos -->
        <p class="alta-section-label">Fotografías (3 requeridas)</p>

        <div class="fotos-grid">
            <div class="foto-card" *ngFor="let slot of [0, 1, 2]; let i = index">
            <div class="foto-box">
                <img *ngIf="previews[i]" [src]="previews[i]" alt="Foto {{ i + 1 }}" />
                <span *ngIf="!previews[i]">Foto {{ i + 1 }}</span>
            </div>

            <div class="foto-actions">
                <ion-button size="small" fill="outline" class="foto-btn" (click)="seleccionarFoto(i, 'camera')">
                <ion-icon slot="icon-only" name="camera-outline"></ion-icon>
                </ion-button>
                <ion-button size="small" fill="outline" class="foto-btn" (click)="seleccionarFoto(i, 'photos')">
                <ion-icon slot="icon-only" name="images-outline"></ion-icon>
                </ion-button>
            </div>
            </div>
        </div>

        <!-- Banners de Notificación inline (Sin alert) -->
        <div class="banner-error" *ngIf="mensajeError">
            {{ mensajeError }}
        </div>

        <div class="banner-exito" *ngIf="mensajeExito">
            {{ mensajeExito }}
        </div>

        <!-- Botón Submit -->
        <ion-button expand="block" type="submit" class="alta-submit">
            Registrar Bebida
        </ion-button>

        </form>
    </div>
    </ion-content>
