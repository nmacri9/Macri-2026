<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #FCF3E1;">
    <ion-title style="color: #6B002B; font-family: 'EB Garamond', serif;">Carga de Platos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="alta-content">
  <!-- Spinner / Indicador de Carga Excluyente -->
  <div *ngIf="cargando" class="spinner-container">
    <ion-spinner name="crescent" style="color: #6B002B;"></ion-spinner>
    <p>Cargando plato en el menú...</p>
  </div>

  <div class="alta-container" *ngIf="!cargando">

    <div class="alta-header">
      <h2 class="alta-title">Alta de Plato</h2>
      <p class="alta-subtitle">Perfil Cocinero</p>
      <div class="alta-divider"></div>
    </div>

    <form [formGroup]="platoForm" (ngSubmit)="guardar()">

      <!-- Nombre del plato -->
      <ion-item class="alta-item" lines="none">
        <ion-icon name="restaurant-outline" slot="start"></ion-icon>
        <ion-input
          formControlName="nombre"
          type="text"
          placeholder="Nombre del plato">
        </ion-input>
      </ion-item>
      <div class="error-text" *ngIf="platoForm.get('nombre')?.touched && platoForm.get('nombre')?.invalid">
        El nombre es obligatorio.
      </div>

      <!-- Descripción -->
      <ion-item class="alta-item" lines="none">
        <ion-icon name="document-text-outline" slot="start"></ion-icon>
        <ion-textarea
          formControlName="descripcion"
          rows="2"
          placeholder="Descripción">
        </ion-textarea>
      </ion-item>
      <div class="error-text" *ngIf="platoForm.get('descripcion')?.touched && platoForm.get('descripcion')?.invalid">
        Ingrese una descripción válida.
      </div>

      <!-- Tiempo de elaboración -->
      <ion-item class="alta-item" lines="none">
        <ion-icon name="time-outline" slot="start"></ion-icon>
        <ion-input
          formControlName="tiempo_elaboracion"
          type="number"
          placeholder="Tiempo de elaboración (minutos)">
        </ion-input>
      </ion-item>
      <div class="error-text" *ngIf="platoForm.get('tiempo_elaboracion')?.touched && platoForm.get('tiempo_elaboracion')?.invalid">
        Ingrese un tiempo válido en minutos.
      </div>

      <!-- Precio -->
      <ion-item class="alta-item" lines="none">
        <ion-icon name="cash-outline" slot="start"></ion-icon>
        <ion-input
          formControlName="precio"
          type="number"
          placeholder="Precio ($)">
        </ion-input>
      </ion-item>
      <div class="error-text" *ngIf="platoForm.get('precio')?.touched && platoForm.get('precio')?.invalid">
        Ingrese un precio válido.
      </div>

      <!-- Sección de Fotos -->
      <p class="alta-section-label">Fotografías (3 requeridas)</p>

      <div class="fotos-grid">
        <div class="foto-card" *ngFor="let slot of [0, 1, 2]; let i = index">
          <div class="foto-box">
            <img *ngIf="previews[i]" [src]="previews[i]" alt="Foto {{ i + 1 }}" />
            <span *ngIf="!previews[i]">Foto {{ i + 1 }}</span>
          </div>

          <div class="foto-actions">
            <ion-button size="small" fill="outline" class="foto-btn" (click)="seleccionarFoto(i, 'camera')">
              <ion-icon name="camera-outline"></ion-icon>
            </ion-button>
            <ion-button size="small" fill="outline" class="foto-btn" (click)="seleccionarFoto(i, 'photos')">
              <ion-icon name="images-outline"></ion-icon>
            </ion-button>
          </div>
        </div>
      </div>

      <!-- Banners de Notificación inline (Sin alert) -->
      <div class="banner-error" *ngIf="mensajeError">
        {{ mensajeError }}
      </div>

      <div class="banner-exito" *ngIf="mensajeExito">
        {{ mensajeExito }}
      </div>

      <!-- Botón Submit -->
      <ion-button expand="block" type="submit" class="alta-submit">
        Registrar Plato
      </ion-button>

    </form>
  </div>
</ion-content>
